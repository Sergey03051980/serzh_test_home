[tool.poetry]
name = "serzh_homework"
version = "0.1.0"
description = "Аналитика финансовых операций"
authors = ["Serzh Ivashchenko <serzh466163@gmail.com>"]
readme = "README.md"

packages = [
    {include = "analysis_bank", from = "src"}
]

[tool.poetry.dependencies]
python = ">=3.9,<=3.13.3"
pandas = "^2.3.0"
requests = "^2.32.4"
flask = "^3.1.1"
pytest-flask = "^1.3.0"
pydantic = "^2.11.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
flake8 = "^6.0.0"
pytest-cov = "^6.1.1"

[tool.poetry.group.lint.dependencies]
black = "^23.3.0"
isort = "^5.12.0"
mypy = "^1.9.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=html --cov-report=term"
pythonpath = ["src"]

[tool.coverage.run]
omit = ["*/tests/*, */venv/*"]
source = ["src"]
branch = true  # Проверять покрытие ветвлений

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = true
fail_under = 80

[tool.black]
line-length = 119
exclude = '''
/(
    \.git
)/
'''

[tool.isort]
profile = "black"
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = "venv"
